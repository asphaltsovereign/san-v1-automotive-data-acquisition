[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit ADS1X15 @ ^2.5.0
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4
  mikalhart/TinyGPSPlus @ ^1.1.0
build_flags =
  -DCORE_DEBUG_LEVEL=1

